name: ios

# يبني تطبيق «وزن» الأصلي (SwiftUI) للمحاكي، ويشغّل الفحص الذاتي للمحرك داخله، ويصوّر شاشاته
# بوضع التصوير (-shot)، ثم يرفع الصور وسجلات البناء إلى فرع ios-screens.
# لا ينشر شيئاً للتثبيت؛ الرفع إلى TestFlight من مستودع anthima (apps-testflight).
on:
  push:
    branches: [main, native]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-15-intel
    timeout-minutes: 75
    env:
      SHOTS: "weigh broken poem3 write anthology diwans poem musajala settings"
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app | grep -v beta | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version
          mkdir -p "$RUNNER_TEMP/out"

      - name: Generate project
        run: |
          ios/build_web.sh
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Build for simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project Wazn.xcodeproj -scheme Wazn -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build \
            > build.log 2>&1 || true
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" build.log | head -80 || true
          { echo "== errors"; grep -E -B2 -A8 "error:" build.log | head -400; echo "== warnings in App"; grep -E "warning:" build.log | grep "/App/" | sort -u | head -80; tail -n 30 build.log; } > "$RUNNER_TEMP/out/build-summary.txt" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Self-check and screenshots
        working-directory: ios
        run: |
          APP=$(find build/Build/Products -name "Wazn.app" -maxdepth 3 | head -1)
          SH="$RUNNER_TEMP/out"
          : > "$SH/problems.txt"
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devs.json"
          pick() {
            cat "$RUNNER_TEMP/devs.json" | python3 -c "
          import json,sys
          want=sys.argv[1]
          c=[x for k,v in json.load(sys.stdin)['devices'].items() if 'iOS' in k for x in v]
          if want=='ipad':
              m=[x for x in c if x['name']=='iPad (A16)'] or [x for x in c if x['name'].startswith('iPad') and 'Pro' not in x['name']] or [x for x in c if x['name'].startswith('iPad')]
          else:
              m=[x for x in c if x['name'].startswith('iPhone') and 'Pro' in x['name'] and 'Max' not in x['name']]
          print(m[-1]['udid']+' '+m[-1]['name'])
          " "$1"
          }
          shoot() {
            read U N <<< "$(pick $1)"; echo "== $1: $N"
            xcrun simctl boot "$U"; xcrun simctl bootstatus "$U" -b > /dev/null
            xcrun simctl status_bar "$U" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3
            xcrun simctl install "$U" "$APP"
            DOCS="$(xcrun simctl get_app_container "$U" com.gts2svg.wazn data)/Documents"
            if [ "$1" = iphone ]; then
              xcrun simctl launch "$U" com.gts2svg.wazn -selfcheck > /dev/null
              for w in $(seq 1 120); do [ -f "$DOCS/selfcheck.txt" ] && break; sleep 1; done
              echo "---- selfcheck"
              cat "$DOCS/selfcheck.txt" | tee "$SH/selfcheck.txt" || echo "no selfcheck output"
              grep -q "SELFCHECK OK" "$DOCS/selfcheck.txt" 2>/dev/null || echo "selfcheck failed" >> "$SH/problems.txt"
              xcrun simctl terminate "$U" com.gts2svg.wazn > /dev/null 2>&1 || true
            fi
            i=0
            for s in $SHOTS; do
              i=$((i+1))
              xcrun simctl terminate "$U" com.gts2svg.wazn > /dev/null 2>&1 || true
              rm -f "$DOCS/shot-ready.txt"
              PID=$(xcrun simctl launch "$U" com.gts2svg.wazn -shot "$s" | awk '{print $NF}')
              for w in $(seq 1 120); do [ -f "$DOCS/shot-ready.txt" ] && break; sleep 0.5; done
              [ -f "$DOCS/shot-ready.txt" ] || echo "::warning::$1 $s: no ready marker"
              sleep 1.5
              xcrun simctl io "$U" screenshot "$SH/$1-$(printf %02d $i)-$s.png" > /dev/null
              if ! ps -p "$PID" > /dev/null 2>&1; then echo "::error::$1 $s: the app quit"; echo "$1 $s crashed" >> "$SH/problems.txt"; fi
            done
            xcrun simctl shutdown "$U" || true
          }
          shoot iphone
          SHOTS="weigh diwans" shoot ipad
          ls -la "$SH"
          ls ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -i wazn | head || true
          for f in $(ls ~/Library/Logs/DiagnosticReports/Wazn* 2>/dev/null | head -2); do head -150 "$f" >> "$SH/crash.txt"; done

      - name: Publish screenshots and logs to the ios-screens branch
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/screens" && cd "$RUNNER_TEMP/screens"
          git init -q -b ios-screens
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          cp "$RUNNER_TEMP"/out/* . 2>/dev/null || true
          echo "${GITHUB_SHA} ${GITHUB_REF_NAME} ${{ job.status }}" > run.txt
          git add -A
          git commit -q -m "ios screenshots for ${GITHUB_SHA::7} (${GITHUB_REF_NAME})"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ios-screens

      - name: Check the app stayed open
        run: |
          if [ -s "$RUNNER_TEMP/out/problems.txt" ]; then cat "$RUNNER_TEMP/out/problems.txt"; exit 1; fi
