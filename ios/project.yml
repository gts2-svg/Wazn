name: Wazn
options:
  developmentLanguage: ar
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.2.1"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  Wazn:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["Data/**", "Fonts/**", "JS/**"]
      # الشعر والقاموس (ينسخها build_web.sh من data/)، ونواة المحرك، والخطوط: مجلدات كما هي داخل التطبيق
      - path: App/Data
        type: folder
        buildPhase: resources
      - path: App/JS
        type: folder
        buildPhase: resources
      - path: App/Fonts
        type: folder
        buildPhase: resources
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gts2svg.wazn
        PRODUCT_NAME: Wazn
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: وزن
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations: [ar]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        # «انظم» يكمل في الخلفية بعد خروج المستخدم (مهمة يبدأها بيده)
        BGTaskSchedulerPermittedIdentifiers: ["com.gts2svg.wazn.compose.*"]
